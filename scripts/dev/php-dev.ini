; Local development overrides, loaded through PHP_INI_SCAN_DIR by scripts/dev.ps1.
; They apply to every PHP process the dev script starts, including the
; child server process spawned by `artisan serve`.

; The Files module accepts uploads up to 10 MB.
upload_max_filesize = 10M
post_max_size = 11M

; OPcache is disabled in the stock WinGet php.ini; enabling it makes
; local requests several times faster.
zend_extension = opcache
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
